[project]
name = "vpop-calibration"
version = "4.7.0"
description = ""
authors = [{ name = "Paul Lemarre", email = "paul.lemarre@novainsilico.ai" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"

[tool.poetry.dependencies]
torch = ">=2.10.0"
scipy = ">=1.16.3, <2.0.0"
uuid = ">=1.30,<2.0"
pandas = ">=2.2.2,<3.0.0"
numpy = ">=2.3.4,<3.0.0"
pydantic = ">=2.13.0,<3.0.0"
pandera = ">=0.31.0,<0.32.0"

gpytorch = { version = ">=1.14.2,<2.0.0", optional = true}
matplotlib = { version = ">=3.10.7,<4.0.0", optional = true}
libroadrunner = { version = ">=2.9.2,<3.0.0", optional = true}
tqdm = { version = ">=4.67.1,<5.0.0", optional = true}
plotnine = { version = "^0.15.1", optional = true}
lifelines = {version = "^0.30.3", extras = ["full"]}

[tool.poetry.extras]
full = ["gpytorch", "matplotlib", "libroadrunner", "tqdm", "plotnine"]

[tool.poetry.group.dev.dependencies]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl" }
ipykernel = "^7.1.0"
ipython = "^9.7.0"
nbmake = "^1.5.5"
jupyter = "^1.1.1"
jupyterlab = "^4.4.10"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pytest-env = "^1.2.0"
pytest-profiling = "^1.8.1"
pre-commit = "^4.5.0"
pytest-subtests = "^0.15.0"
py-spy = "^0.4.2"
pytest-golden = "^1.0.1"
deepdiff = "^9.1.0"
nbmake = "^1.5.5"

[tool.poetry.group.test_slim.dependencies]
pytest = "^9.0.1"
pytest-env = "^1.2.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "-q",
    "--cov=vpop_calibration",
    "--cov-report=markdown",
    "--nbmake",
    "--nbmake-timeout=100",
    "--profile",
    "--durations=5",
]
testpaths = ["vpop_calibration/test", "examples/saem", "examples/benchmarking"]
filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]
env = ["IS_PYTEST_RUNNING=True", "CUDA_VISIBLE_DEVICES=", "MPLBACKEND=agg"]
enable_assertion_pass_hook = true

[tool.coverage.run]
branch = true
omit = ["vpop_calibration/test/*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
show_missing = true
ignore_errors = true

[tool.ruff.lint]
ignore = ["F403", "F405"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff]
exclude = [".venv*"]
